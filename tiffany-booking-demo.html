<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tiffany's Show Booking Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#000;--surface:#25252c;--surface-2:#30303b;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.18);--text:#f4f4f8;--muted:#b6b6c4;--faint:#868696;--violet:#5f5cfa;--violet-hi:#7370ff;--orchid:#e697f6;--pink:#e563b5;--gold:#f2c14b;--ok:#7fdcae;--primary-grad:linear-gradient(180deg,#7370ff,#5f5cfa);--mark-a:#5f5cfa;--mark-b:#eae9f3;--display:'Chiswick Sans Text','Instrument Sans','Nirand','Anuphan',system-ui,sans-serif;--body:'Nirand','Anuphan','Instrument Sans',system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#0e0e10}
body{font:15px/1.45 var(--body);color:var(--text);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.app{max-width:430px;min-height:100vh;margin:0 auto;background:var(--bg);display:flex;flex-direction:column;padding-bottom:84px}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.wm svg{display:block;height:38px;width:auto;color:#fff}
.lg-a{fill:var(--mark-a)}.lg-b{fill:var(--mark-b)}
.lang-w{position:relative;display:grid;justify-items:center;gap:3px}
.lang-l{font-size:10.5px;color:var(--muted)}
.lang-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:94px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;cursor:pointer;font-size:13px}
.lang-btn svg{width:13px;height:13px;color:var(--muted);transition:transform .2s}
.lang-btn[aria-expanded="true"] svg{transform:rotate(180deg)}
.lang-m{position:absolute;right:0;top:calc(100% + 6px);z-index:30;min-width:168px;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line-2);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.55)}
.lang-m[hidden]{display:none}
.lang-m button{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;padding:9px 10px;border:0;border-radius:9px;background:transparent;cursor:pointer;font-size:14px;text-align:left}
.lang-m button:hover,.lang-m button:focus-visible{background:var(--surface-2);outline:none}
.lang-m small{color:var(--faint);font-size:11.5px}
.lang-m .ck{width:16px;height:16px;color:var(--orchid);visibility:hidden}
.lang-m [aria-selected="true"] .ck{visibility:visible}

.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:0 16px 10px;border-bottom:1px solid var(--line)}
.steps span{display:grid;gap:7px;text-align:center;font-size:13px;color:var(--faint)}
.steps span::before{content:'';height:4px;border-radius:2px;background:var(--surface-2)}
.steps span.on{color:var(--text);font-weight:600}
.steps span.on::before{background:var(--orchid)}

/* promo slider */
.promo{padding:16px 0 0}
.track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;scroll-padding:0 16px;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;aspect-ratio:358/190;border:0;padding:0;border-radius:20px;overflow:hidden;scroll-snap-align:start;cursor:pointer;text-align:left;background:#222;isolation:isolate}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.slide::before{content:'';position:absolute;inset:0;z-index:-1}
.s1 img{object-position:60% 40%}
.s1::before{background:linear-gradient(90deg,rgba(14,10,40,.88) 0%,rgba(14,10,40,.62) 42%,rgba(14,10,40,0) 62%)}
.s2 img{object-position:50% 72%}
.s2::before{background:linear-gradient(90deg,rgba(90,20,14,.55) 0%,rgba(90,20,14,.25) 50%,rgba(90,20,14,0) 65%)}
.s3 img{transform:scaleX(-1);object-position:50% 30%}
.s3::before{background:linear-gradient(90deg,rgba(4,10,30,.9) 0%,rgba(4,10,30,.6) 45%,rgba(4,10,30,0) 66%)}
.sc{position:absolute;inset:0;padding:15px 16px;display:flex;flex-direction:column;align-items:flex-start;max-width:60%}
.s2 .sc{max-width:58%}
.ey{font-size:11.5px;letter-spacing:.02em;color:rgba(255,255,255,.85)}
.hd{font:600 19px/1.18 var(--display);white-space:pre-line;margin-top:4px;text-wrap:balance;text-shadow:0 1px 10px rgba(0,0,0,.35)}
:lang(th) .hd{font-family:var(--body);line-height:1.3}
.sb{font-size:12px;line-height:1.35;color:rgba(255,255,255,.88);margin-top:5px}
.tg{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;padding:4px 10px;border-radius:999px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.28)}
.tg code{font:700 12px var(--display);letter-spacing:.05em;padding:1px 6px;border:1px dashed rgba(255,255,255,.6);border-radius:6px}
.dots{display:flex;justify-content:center;gap:10px;padding:12px 0 2px}
.dots button{width:8px;height:8px;padding:0;border:0;border-radius:4px;background:#3a3a44;cursor:pointer;transition:width .25s,background .25s}
.dots button[aria-current="true"]{width:30px;background:var(--orchid)}

/* hero */
.hero-w{position:relative;margin:16px 16px 0}
.hero{position:relative;border-radius:20px;overflow:hidden;min-height:186px;padding:18px 16px 14px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr auto;column-gap:16px;isolation:isolate}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:right center;z-index:-1}
.hero .lg{display:grid;justify-items:center;gap:6px;width:64px;padding-top:4px}
.hero .lg .mk svg{display:block;height:46px;width:auto}
.hero .lg .wd svg{display:block;width:62px;height:auto;color:#fff}
.hero h1{margin:0;font:300 28px/1.02 var(--display);letter-spacing:.005em}
.hero h1 small{display:block;font:400 12px/1.4 var(--display);margin-top:7px;letter-spacing:.04em;color:rgba(255,255,255,.88)}
.hero .st{grid-column:1/-1;grid-row:3;margin-top:16px;font-size:14px;line-height:1.35}
.hero .st b{display:block;font:600 15px var(--display)}
.hero .st .ex{color:var(--orchid);font-size:13px}
.laser{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.laser rect{fill:none}
.laser .base{stroke:rgba(255,255,255,.07);stroke-width:1}
.laser .beam{stroke-width:1.6;stroke-linecap:round;stroke-dasharray:12 88;animation:run 5.5s linear infinite,hue 11s linear infinite}
.laser .glow{stroke-width:5;opacity:.55}
@keyframes run{to{stroke-dashoffset:-100}}
@keyframes hue{0%,100%{stroke:#e697f6}25%{stroke:#7370ff}50%{stroke:#7cd4ff}75%{stroke:#e563b5}}

/* section bands */
.band{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:20px;padding:8px 16px;min-height:44px;background:linear-gradient(90deg,#6c69f2 0%,rgba(95,92,250,.35) 45%,rgba(0,0,0,0) 100%)}
.band h2{margin:0;font:600 17px var(--display)}
:lang(th) .band h2{font-family:var(--body)}
.band .dt{font-size:13px}
.cal-btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 11px;border-radius:999px;border:1px solid var(--line-2);background:#1e1e24;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.cal-btn svg{width:16px;height:16px}
.cal-btn .chev{width:14px;height:14px;color:var(--muted)}

/* date strip */
.dates{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;scroll-padding:0 16px}
.dates::-webkit-scrollbar{display:none}
.date{flex:0 0 60px;height:78px;border-radius:14px;border:1px solid var(--line-2);background:#1e1e24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.date .w{font-size:12px;color:var(--muted)}
.date .d{font:500 23px/1.1 var(--display)}
.date .m{font-size:11px;color:var(--muted)}
.date.x,.cal-d.x{background:var(--pink);border-color:transparent;color:#fff}
.date.p,.cal-d.p{background:var(--gold);border-color:transparent;color:#221a00}
.date.x .w,.date.x .m{color:rgba(255,255,255,.88)}
.date.p .w,.date.p .m{color:rgba(34,26,0,.75)}
.date.sel:not(.x):not(.p),.cal-d.sel:not(.x):not(.p){background:var(--primary-grad);border-color:transparent;color:#fff}
.date.sel:not(.x):not(.p) .w,.date.sel:not(.x):not(.p) .m{color:rgba(255,255,255,.85)}
.date.sel.x,.date.sel.p,.cal-d.sel.x,.cal-d.sel.p{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
.dates .date.sel.x,.dates .date.sel.p{margin:0 3px}
.legend{display:grid;gap:4px;padding:10px 16px 0;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:10px}
.legend i{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.k-x{background:var(--pink)}.k-p{background:var(--gold)}

/* showtimes */
.note{display:flex;align-items:center;gap:8px;margin:12px 16px 0;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.35}
.note svg{width:16px;height:16px;flex:0 0 auto}
.note.p{background:rgba(242,193,75,.14);color:var(--gold);border:1px solid rgba(242,193,75,.35)}
.note.x{background:rgba(229,99,181,.14);color:#ffb3df;border:1px solid rgba(229,99,181,.4)}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0}
.time{position:relative;min-height:100px;border-radius:18px;border:2px solid transparent;background:linear-gradient(160deg,#6d6aff,#5f5cfa);padding:12px 14px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column}
.time b{font:500 30px/1.05 var(--display);letter-spacing:-.01em}
.time .sl{font-size:12.5px;opacity:.92}
.time .bar{margin-top:auto;height:4px;border-radius:2px;background:rgba(255,255,255,.18);overflow:hidden}
.time .bar i{display:block;height:100%;background:var(--ok);border-radius:2px}
.time.xs{background:linear-gradient(160deg,#ee77c3,#d9509f)}
.time.ps{background:linear-gradient(160deg,#f8d572,#eab53a);color:#241b00}
.time.ps .bar{background:rgba(36,27,0,.16)}
.time.ps .bar i{background:#2f9a64}
.time .tag{position:absolute;top:10px;right:10px;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.95);color:#b0307c}
.time.ps .tag{color:#8a6100}
.time[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}

/* bottom bar */
.bb{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:430px;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--violet)}
.bb .l{font-size:12px;opacity:.75}
.bb .v{font:600 15px var(--display)}
.bb .go{height:46px;padding:0 20px;border-radius:14px;border:0;background:#fff;color:#2b2a8c;font-weight:600;font-size:15px;cursor:pointer}
.bb .go:disabled{background:rgba(30,30,40,.55);color:rgba(255,255,255,.55);cursor:not-allowed}

/* sheets & dialog */
.layer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease-out}
.layer.c{align-items:center;padding:20px}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:430px;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 10px}
.sh-hd{display:flex;align-items:center;justify-content:space-between}
.sh-hd h3{margin:0;font-size:18px;font-weight:600}
.x-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--muted);cursor:pointer}
.mnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0 6px}
.mnav b{font-size:15px;font-weight:600}
.nv{width:36px;height:36px;border-radius:50%;border:1px solid var(--line-2);background:transparent;display:grid;place-items:center;cursor:pointer}
.nv:disabled{opacity:.3;cursor:default}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal-wd{font-size:11.5px;color:var(--faint);padding:4px 0}
.cal-d{position:relative;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;font:500 15px var(--display);cursor:pointer;padding:0}
button.cal-d:not(.x):not(.p):not(.sel):hover{background:var(--surface-2)}
.cal-d.off{color:#55555f;cursor:default}
.cal-d .td{position:absolute;bottom:3px;left:0;right:0;font:500 9px var(--body);opacity:.9}
.cal-d.today{padding-bottom:9px}
.cal-lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.cal-lg span{display:inline-flex;align-items:center;gap:7px}
.cal-lg i{width:16px;height:12px;border-radius:4px}
.dlg{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line-2);border-radius:22px;padding:20px 20px 18px;text-align:center;animation:up .22s ease-out}
.dlg .ic{width:46px;height:46px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;background:rgba(230,151,246,.15);color:var(--orchid)}
.dlg h3{margin:0 0 6px;font-size:18px}
.dlg p{margin:0;color:var(--muted);font-size:14px}
.dlg .ty{margin:14px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);color:var(--text);font-size:13.5px;text-align:left}
.dlg .ty b{display:block;font-size:11.5px;color:var(--orchid);font-weight:600;margin-bottom:2px}
.dlg .ok{margin-top:16px;width:100%;height:46px;border:0;border-radius:14px;background:var(--primary-grad);color:#fff;font-weight:600;font-size:15px;cursor:pointer}
:focus-visible{outline:2px solid var(--orchid);outline-offset:2px}
.seas{display:flex;align-items:center;gap:6px;padding:7px 16px;background:#141418;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.seas::-webkit-scrollbar{display:none}
.seas>span{font-size:11px;color:var(--faint);white-space:nowrap;margin-right:2px}
.seas button{flex:0 0 auto;height:26px;padding:0 10px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:12px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seas button[aria-pressed="true"]{background:var(--orchid);border-color:transparent;color:#1b1430;font-weight:600}
.fx{position:fixed;top:0;bottom:0;left:50%;width:min(100%,430px);transform:translateX(-50%);pointer-events:none;z-index:15;overflow:hidden}
.fx i{position:absolute;left:0;top:0;opacity:0;will-change:transform,opacity}
.fx i svg,.fx i img{display:block;width:100%;height:100%}
.fx i.st{filter:drop-shadow(0 0 3px rgba(255,255,255,.55))}
@media (prefers-reduced-motion:reduce){.laser .beam{animation:none;stroke-dasharray:none;stroke:#e697f6;opacity:.35}.layer,.sheet,.dlg{animation:none}.track{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <div class="seas" id="seasons" role="group" aria-labelledby="seasL"><span id="seasL" data-t="seas"></span><button data-season="normal" data-t="se_n"></button><button data-season="xmas" data-t="se_x"></button><button data-season="halloween" data-t="se_h"></button><button data-season="songkran" data-t="se_s"></button></div>
  <header class="hdr">
    <span class="wm" id="wm"></span>
    <div class="lang-w">
      <span class="lang-l" data-t="lang_l"></span>
      <button class="lang-btn" id="langBtn" aria-haspopup="listbox" aria-expanded="false" aria-controls="langMenu"><span id="langCur"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button>
      <ul class="lang-m" id="langMenu" role="listbox" hidden></ul>
    </div>
  </header>
  <nav class="steps" aria-label="Booking steps"><span class="on" data-t="st1"></span><span data-t="st2"></span><span data-t="st3"></span><span data-t="st4"></span></nav>

  <section class="promo" aria-roledescription="carousel" aria-label="Promotions">
    <div class="track" id="track">
      <button class="slide s1" data-promo="office"><img src="demo-img/promo1.jpg" alt=""><span class="sc"><span class="ey" data-t="p1_e"></span><span class="hd" data-t="p1_h"></span><span class="sb" data-t="p1_s"></span><span class="tg" data-t="p1_t"></span></span></button>
      <button class="slide s2" data-promo="partner"><img src="demo-img/promo2.jpg" alt=""><span class="sc"><span class="ey">Show &amp; Dine · Thai Marché</span><span class="hd" data-t="p2_h"></span><span class="sb" data-t="p2_s"></span><span class="tg" data-t="p2_t"></span></span></button>
      <button class="slide s3" data-promo="code"><img src="demo-img/promo3.jpg" alt=""><span class="sc"><span class="ey" data-t="p3_e"></span><span class="hd" data-t="p3_h"></span><span class="sb" data-t="p3_s"></span><span class="tg"><span data-t="p3_t"></span><code>EARLY15</code></span></span></button>
    </div>
    <div class="dots" id="dots"></div>
  </section>

  <div class="hero-w">
    <div class="hero">
      <img src="demo-img/hero.jpg" alt="">
      <span class="lg"><span class="mk" id="mk"></span><span class="wd" id="wd"></span></span>
      <h1>Pattaya's<br>Astonishing<small>Eye-Opening Performance</small></h1>
      <p class="st"><b data-t="h_st"></b><span data-t="h_tm"></span><br><span class="ex" data-t="h_ex"></span></p>
    </div>
    <svg class="laser" aria-hidden="true">
      <defs><filter id="gl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter></defs>
      <rect class="base" width="100%" height="100%" rx="20" ry="20"/>
      <rect class="beam glow" width="100%" height="100%" rx="20" ry="20" pathLength="100" filter="url(#gl)"/>
      <rect class="beam" width="100%" height="100%" rx="20" ry="20" pathLength="100"/>
    </svg>
  </div>

  <div class="band"><h2 data-t="pick_date"></h2><button class="cal-btn" id="calBtn" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span id="calLbl"></span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button></div>
  <div class="dates" id="dates" role="listbox"></div>
  <div class="legend"><span><i class="k-x"></i><span data-t="lg_x"></span></span><span><i class="k-p"></i><span data-t="lg_p"></span></span></div>

  <div class="band"><h2 data-t="pick_time"></h2><span class="dt" id="dayLbl"></span></div>
  <div id="note"></div>
  <div class="times" id="times"></div>
</div>

<div class="bb"><div><div class="l" id="bbL"></div><div class="v" id="bbV">–</div></div><button class="go" id="go" disabled data-t="go"></button></div>
<div class="fx" id="fx" aria-hidden="true"></div>

cal:'Выберите дату',prev:'Предыдущий месяц',next:'Следующий месяц',off:'Бронирование недоступно',close:'Закрыть',
d_h:'Это демо-сайт',d_p:'Он показывает, как будет выглядеть страница бронирования с настоящими акциями. Ничего не бронируется и не списывается.',d_ty:'Как работает эта акция',ok:'Понятно',
t_office:'Только в кассе. Сотрудники проверяют тайское удостоверение личности и возраст детей, поэтому онлайн купить нельзя.',
t_partner:'Промокод не нужен. Покажите билет Tiffany’s Show в Thai Marché, чтобы получить цену сет-меню.',
t_code:'На настоящем сайте нажатие на баннер добавит код EARLY15 и снизит цену на 15% до оплаты.',
t_seats:'На настоящем сайте здесь откроется схема зала для сеанса {s}.'}};
const LANGS=[['th','ไทย','Thai','th-TH'],['en','English','English','en-GB'],['zh','中文','Chinese','zh-CN'],['ru','Русский','Russian','ru-RU']];
const S={lang:'en',date:0,time:null,calM:0,slide:0};
try{const l=localStorage.getItem('tf-demo-lang');if(I18N[l])S.lang=l}catch(e){}
const $=(q,r=document)=>r.querySelector(q),$$=(q,r=document)=>[...r.querySelectorAll(q)];
const t=(k,v)=>{let s=I18N[S.lang][k]??I18N.en[k]??k;if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const loc=()=>LANGS.find(l=>l[0]===S.lang)[3];
const fmt=(d,o)=>new Intl.DateTimeFormat(loc(),o).format(d);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const monthLabel=d=>cap(fmt(d,{month:'long',year:'numeric'}));
const CHEV_L='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
const CHEV_R='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>';
const X_IC='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const CROWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 17h18l-1.6-10-4.9 4L12 4 9.5 11l-4.9-4L3 17z"/><path d="M4 20.5h16"/></svg>';
const PLUS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>';
const CHECK='<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>';

// 30 bookable days from today; Saturdays get an extra 16:30 show, the Sunday after the first Saturday is the preliminary night
const T0=new Date();T0.setHours(0,0,0,0);
const DATES=Array.from({length:30},(_,i)=>new Date(T0.getFullYear(),T0.getMonth(),T0.getDate()+i));
const isX=i=>DATES[i].getDay()===6;
const PRELIM=DATES.findIndex((d,i)=>i>0&&d.getDay()===0&&isX(i-1));
const kind=i=>i===PRELIM?'p':isX(i)?'x':'';
const PRELIM_SHOW='19:30';
const showsFor=i=>(isX(i)?['16:30']:[]).concat(['18:00','19:30','21:00']);
const seatsLeft=(i,k)=>80+((i*47+k*83+31)%240);
const dayIdx=d=>Math.round((d-T0)/864e5);

$('#wm').innerHTML=LOGO.word;$('#mk').innerHTML=LOGO.mark;$('#wd').innerHTML=LOGO.word;

function applyLang(){
  document.documentElement.lang=S.lang;
  $$('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  $('#langCur').textContent=LANGS.find(l=>l[0]===S.lang)[1];
  $('#langMenu').innerHTML=LANGS.map(([c,n,en])=>`<li><button role="option" data-lang="${c}" aria-selected="${c===S.lang}"><span>${n}${c!=='en'?` <small>${en}</small>`:''}</span>${CHECK}</button></li>`).join('');
  $('#langBtn').setAttribute('aria-label',t('lang_l')+': '+LANGS.find(l=>l[0]===S.lang)[1]);
  $('#calBtn').setAttribute('aria-label',t('cal')+': '+monthLabel(DATES[S.date]));
  $$('.slide').forEach((s,i)=>s.setAttribute('aria-label',`${i+1}/3 · ${$('.hd',s).textContent}`));
  renderDates(false);renderTimes();renderBar();
}
function renderDates(scroll){
  $('#calLbl').textContent=monthLabel(DATES[S.date]);
  $('#dates').innerHTML=DATES.map((d,i)=>{const k=kind(i),sel=i===S.date;
    return `<button class="date ${k}${sel?' sel':''}" role="option" aria-selected="${sel}" data-i="${i}" aria-label="${fmt(d,{weekday:'long',day:'numeric',month:'long'})}${k==='x'?' · '+t('lg_x'):k==='p'?' · '+t('lg_p'):''}"><span class="w">${i===0?t('today'):cap(fmt(d,{weekday:'short'}))}</span><span class="d">${d.getDate()}</span><span class="m">${fmt(d,{month:'short'})}</span></button>`}).join('');
  if(scroll){const el=$('.date.sel');el.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}
}
function renderTimes(){
  const i=S.date,d=DATES[i],k=kind(i);
  $('#dayLbl').textContent=fmt(d,{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  $('#note').innerHTML=k==='p'?`<div class="note p">${CROWN}${t('n_p')}</div>`:k==='x'?`<div class="note x">${PLUS}${t('n_x')}</div>`:'';
  $('#times').innerHTML=showsFor(i).map((s,j)=>{const n=seatsLeft(i,j),xs=s==='16:30';
    const ps=k==='p'&&s===PRELIM_SHOW;
    return `<button class="time${xs?' xs':''}${ps?' ps':''}" data-s="${s}" aria-pressed="${S.time===s}">${xs?`<span class="tag">${t('xs')}</span>`:ps?`<span class="tag">${t('ps')}</span>`:''}<b>${s}</b><span class="sl">${t('left',{n})}</span><span class="bar"><i style="width:${Math.round(n/400*100)}%"></i></span></button>`}).join('');
}
function renderBar(){
  $('#bbL').textContent=S.time?t('picked'):t('none');
  $('#bbV').textContent=S.time?`${fmt(DATES[S.date],{day:'numeric',month:'short'})} · ${S.time}`:'–';
  $('#go').disabled=!S.time;
}
function pickDate(i){S.date=i;S.time=null;renderDates(true);renderTimes();renderBar();$('#calBtn').setAttribute('aria-label',t('cal')+': '+monthLabel(DATES[S.date]))}

// language menu
const langBtn=$('#langBtn'),langMenu=$('#langMenu');
function setMenu(open){langMenu.hidden=!open;langBtn.setAttribute('aria-expanded',open);if(open)$('[aria-selected="true"]',langMenu)?.focus()}
langBtn.onclick=e=>{e.stopPropagation();setMenu(langMenu.hidden)};
langMenu.onclick=e=>{const b=e.target.closest('[data-lang]');if(!b)return;S.lang=b.dataset.lang;try{localStorage.setItem('tf-demo-lang',S.lang)}catch(e){}applyLang();setMenu(false);langBtn.focus()};
langMenu.onkeydown=e=>{const o=$$('[data-lang]',langMenu),i=o.indexOf(document.activeElement);
  if(e.key==='ArrowDown'){e.preventDefault();o[(i+1)%o.length].focus()}else if(e.key==='ArrowUp'){e.preventDefault();o[(i-1+o.length)%o.length].focus()}else if(e.key==='Escape'){setMenu(false);langBtn.focus()}};
document.addEventListener('click',e=>{if(!e.target.closest('.lang-w'))setMenu(false)});

// promo slider
const track=$('#track'),slides=$$('.slide'),dots=$('#dots');
dots.innerHTML=slides.map((_,i)=>`<button aria-label="${i+1}/${slides.length}"></button>`).join('');
const goSlide=i=>track.scrollTo({left:slides[i].offsetLeft-16,behavior:'smooth'});
function syncDots(){const i=Math.round(track.scrollLeft/(slides[0].offsetWidth+10));S.slide=Math.max(0,Math.min(slides.length-1,i));$$('button',dots).forEach((b,j)=>b.setAttribute('aria-current',j===S.slide))}
track.addEventListener('scroll',()=>requestAnimationFrame(syncDots),{passive:true});
dots.onclick=e=>{const b=e.target.closest('button');if(b){goSlide($$('button',dots).indexOf(b));hold()}};
let pauseUntil=0;const hold=()=>pauseUntil=Date.now()+8000;
['pointerdown','touchstart','wheel','focusin'].forEach(ev=>track.addEventListener(ev,hold,{passive:true}));
setInterval(()=>{if(Date.now()<pauseUntil||$('#layer').firstChild||document.hidden)return;goSlide((S.slide+1)%slides.length)},4500);
track.onclick=e=>{const s=e.target.closest('.slide');if(s){hold();demo('t_'+s.dataset.promo)}};
syncDots();

// date strip, showtimes, bottom bar
$('#dates').onclick=e=>{const b=e.target.closest('.date');if(b)pickDate(+b.dataset.i)};
$('#times').onclick=e=>{const b=e.target.closest('.time');if(!b)return;S.time=S.time===b.dataset.s?null:b.dataset.s;$$('.time').forEach(x=>x.setAttribute('aria-pressed',x.dataset.s===S.time));renderBar()};
$('#go').onclick=()=>demo('t_seats',{s:`${fmt(DATES[S.date],{day:'numeric',month:'short'})} ${S.time}`});

// layers
let lastFocus=null;
function openLayer(html,center){lastFocus=document.activeElement;$('#layer').innerHTML=`<div class="layer${center?' c':''}" role="presentation">${html}</div>`;document.body.style.overflow='hidden'}
function closeLayer(){$('#layer').innerHTML='';document.body.style.overflow='';lastFocus?.focus({preventScroll:true})}
$('#layer').addEventListener('click',e=>{if(e.target.classList.contains('layer')||e.target.closest('[data-close]'))closeLayer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#layer').firstChild)closeLayer()});
function demo(k,v){
  openLayer(`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dh"><div class="ic">${PLUS.replace('<path d="M12 8v8M8 12h8"/>','<path d="M12 11v5M12 8h.01"/>')}</div><h3 id="dh">${t('d_h')}</h3><p>${t('d_p')}</p><div class="ty"><b>${t('d_ty')}</b>${t(k,v)}</div><button class="ok" data-close>${t('ok')}</button></div>`,true);
  $('#layer .ok').focus();
}

// month calendar
const months=()=>(DATES[29].getFullYear()-DATES[0].getFullYear())*12+DATES[29].getMonth()-DATES[0].getMonth();
function calBody(){
  const m0=new Date(DATES[0].getFullYear(),DATES[0].getMonth()+S.calM,1),days=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate(),lead=(m0.getDay()+6)%7;
  const wd=Array.from({length:7},(_,j)=>`<span class="cal-wd">${cap(fmt(new Date(2024,0,1+j),{weekday:'short'}))}</span>`).join('');
  let cells='<span></span>'.repeat(lead);
  for(let n=1;n<=days;n++){const d=new Date(m0.getFullYear(),m0.getMonth(),n),i=dayIdx(d);
    if(i<0||i>29){cells+=`<span class="cal-d off" aria-label="${fmt(d,{day:'numeric',month:'long'})} · ${t('off')}">${n}</span>`;continue}
    const k=kind(i),sel=i===S.date;
    cells+=`<button class="cal-d ${k}${sel?' sel':''}${i===0?' today':''}" data-i="${i}" aria-pressed="${sel}" aria-label="${fmt(d,{weekday:'long',day:'numeric',month:'long'})}${k==='x'?' · '+t('lg_x'):k==='p'?' · '+t('lg_p'):''}">${n}${i===0?`<span class="td">${t('today')}</span>`:''}</button>`}
  return `<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ch"><div class="grab"></div>
  <div class="sh-hd"><h3 id="ch">${t('cal')}</h3><button class="x-btn" data-close aria-label="${t('close')}">${X_IC}</button></div>
  <div class="mnav"><button class="nv" data-nav="-1" aria-label="${t('prev')}"${S.calM<=0?' disabled':''}>${CHEV_L}</button><b aria-live="polite">${monthLabel(m0)}</b><button class="nv" data-nav="1" aria-label="${t('next')}"${S.calM>=months()?' disabled':''}>${CHEV_R}</button></div>
  <div class="cal-g">${wd}${cells}</div>
  <div class="cal-lg"><span><i class="k-x"></i>${t('lg_x')}</span><span><i class="k-p"></i>${t('lg_p')}</span></div></div>`;
}
$('#calBtn').onclick=()=>{const d=DATES[S.date];S.calM=(d.getFullYear()-DATES[0].getFullYear())*12+d.getMonth()-DATES[0].getMonth();openLayer(calBody());$('#layer .cal-d.sel')?.focus({preventScroll:true})};
$('#layer').addEventListener('click',e=>{
  const nv=e.target.closest('[data-nav]');
  if(nv&&!nv.disabled){S.calM=Math.max(0,Math.min(months(),S.calM+ +nv.dataset.nav));$('#layer .layer').innerHTML=calBody();$(`#layer [data-nav="${nv.dataset.nav}"]`)?.focus();return}
  const c=e.target.closest('button.cal-d');
  if(c){pickDate(+c.dataset.i);closeLayer();$('.date.sel')?.focus({preventScroll:true})}
});

// seasonal falling glitter: each piece drifts down slowly, turns, fades, then respawns somewhere else
const SEASONS={normal:{art:'star'},xmas:{art:'xmas'},halloween:{art:'halloween'},songkran:{art:'songkran'}};
const rnd=(a,b)=>a+Math.random()*(b-a);
function fxStart(name){
  const fx=$('#fx'),art=(SEASONS[name]||SEASONS.normal).art,N=16;
  fx.getAnimations?.({subtree:true}).forEach(a=>a.cancel());fx.innerHTML='';
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const drop=(el,first)=>{
    const head=el.dataset.k!=='star',w=fx.clientWidth,h=fx.clientHeight,s=head?rnd(22,32):rnd(10,20),x=rnd(0,w-s),y=rnd(-s,h*.75),fy=rnd(90,190),dx=rnd(-24,24),o=rnd(.6,.95),d=rnd(7000,12000);
    // stars spin, heads only sway so the face stays readable
    const r0=head?rnd(-20,20):rnd(0,90),r1=head?-r0*rnd(.6,1.2):r0+rnd(90,200)*(Math.random()<.5?-1:1);
    el.style.width=el.style.height=s+'px';
    const at=k=>`translate(${x+dx*k}px,${y+fy*k}px) rotate(${r0+(r1-r0)*k}deg)`;
    const a=el.animate([{opacity:0,transform:at(0)},{opacity:o,transform:at(.2),offset:.2},{opacity:o,transform:at(.7),offset:.7},{opacity:0,transform:at(1)}],{duration:d,delay:first?rnd(0,d):rnd(0,1500),easing:'linear',fill:'backwards'});
    a.onfinish=()=>drop(el,false);
  };
  // a festive season mixes its head with a few logo sparkles
  for(let k=0;k<N;k++){const kk=art==='star'||k%3===2?'star':art,el=document.createElement('i');el.dataset.k=kk;el.className=kk==='star'?'st':'';el.innerHTML=`<img src="demo-img/fx-${kk}.svg" alt="">`;fx.appendChild(el);drop(el,true)}
}
let season=new URLSearchParams(location.search).get('season');if(!SEASONS[season])season='normal';
function setSeason(n){season=n;fxStart(n);$$('#seasons button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.season===n));
  try{const u=new URL(location.href);n==='normal'?u.searchParams.delete('season'):u.searchParams.set('season',n);history.replaceState(null,'',u)}catch(e){}}
$('#seasons').onclick=e=>{const b=e.target.closest('[data-season]');if(b)setSeason(b.dataset.season)};
setSeason(season);

applyLang();
</script>
