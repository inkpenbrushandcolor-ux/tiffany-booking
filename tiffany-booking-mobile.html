<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiffany's Booking Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Instrument+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0e0e10;--app:#1b1b1c;--surface:#25252c;--surface-2:#30303b;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.18);--text:#f4f4f8;--muted:#b6b6c4;--faint:#868696;--gold:#5f5cfa;--gold-hi:#e697f6;--gold-ink:#1b1b1c;--danger:#ff9191;--warn:#ffc56e;--ok:#7fdcae;--pink-hi:#ffc2e6;--z-diamond:#aab5ff;--z-gold:#f2c14b;--z-silver:#d3d7e0;--z-mezz:#e563b5;--taken:#3a3a44;--pc-0:#3b39a8;--pc-1:#6b3f72;--pc-2:#3a3e78;--pc-3:#3a3a3f;--pc-4:#5a3470;--display:'Chiswick Sans Text','Instrument Sans','Nirand','Anuphan',system-ui,sans-serif;--body:'Nirand','Anuphan',system-ui,-apple-system,sans-serif;--on-primary:#fff;--primary-grad:linear-gradient(180deg,#7370ff,#5f5cfa);--mark-a:#5f5cfa;--mark-b:#eae9f3}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:48px;padding:24px}
.phone{position:relative;width:390px;height:844px;max-height:calc(100vh - 48px);background:var(--app);border:10px solid #050506;border-radius:46px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 90px rgba(0,0,0,.55)}
.proto-banner{flex:0 0 auto;text-align:center;font-size:11px;font-weight:600;padding:5px 12px;background:var(--gold-hi);color:var(--gold-ink)}
.top{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;flex:0 0 auto}
.icon-btn{width:36px;height:36px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line-2);background:transparent;display:grid;place-items:center;cursor:pointer}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:8px;line-height:1}
.lg-mark svg{display:block;height:36px;width:auto}.lg-word svg{display:block;height:30px;width:auto;color:#fff}
.lg-stack{display:flex;flex-direction:column;align-items:center;gap:10px}
.icon-btn+.brand .lg-word svg{height:25px}
.lg-a{fill:var(--mark-a)}.lg-b{fill:var(--mark-b)}
.tk-brand.tk-logo{flex-direction:column;align-items:center;justify-content:center;margin-bottom:4px}.tk-logo .lg-mark svg{height:58px}.tk-logo .lg-word svg{height:38px;color:var(--gold-hi)}
.brand .display{font:500 18px var(--display);color:var(--gold-hi);letter-spacing:.02em;white-space:nowrap}
.brand small{font-size:10px;letter-spacing:.24em;color:var(--muted)}
.hdr-r{display:flex;gap:6px;align-items:center}
.lang{display:flex;border:1px solid var(--line-2);border-radius:999px;padding:2px;background:transparent;cursor:pointer}
.lang span{padding:3px 8px;border-radius:999px;font-size:12px;color:var(--muted)}
.lang span.on{background:var(--surface-2);color:var(--text)}
.demo-chip{display:none;align-items:center;padding:4px 9px;border-radius:999px;border:1px dashed var(--line-2);background:transparent;color:var(--muted);font-size:11px;cursor:pointer}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:2px 14px 12px;flex:0 0 auto;border-bottom:1px solid var(--line)}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--faint);text-align:center}
.st i{width:100%;height:3px;border-radius:2px;background:var(--line-2)}
.st.done{color:var(--muted)}.st.done i{background:var(--gold)}
.st.on{color:var(--text);font-weight:600}.st.on i{background:var(--gold-hi)}
.mrow{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 14px;background:rgba(229,99,181,.14);color:var(--pink-hi);font-size:13px}
.mrow b{font-variant-numeric:tabular-nums;font-size:14px;color:var(--text)}
.mrow button{margin-left:auto;border:1px solid rgba(255,194,230,.4);background:transparent;color:var(--pink-hi);border-radius:999px;padding:3px 12px;font-size:12.5px;cursor:pointer}
.timer{display:flex;justify-content:center;align-items:center;gap:6px;padding:7px 12px;font-size:13px;background:rgba(95,92,250,.12);color:var(--gold-hi);flex:0 0 auto}
.timer.warn{background:rgba(255,145,145,.14);color:var(--danger)}
.timer b{font-variant-numeric:tabular-nums;font-size:14px}
#view{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
.bar-info{flex:1;min-width:0}
.bar-info .k{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-info .v{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 20px;font-weight:600;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn-gold{background:var(--primary-grad);color:var(--on-primary)}
.btn-gold:disabled{background:#34343f;color:#7c7c8a;cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--line-2);color:var(--text)}
.btn-auto{background:rgba(95,92,250,.18);border:1px solid var(--gold);color:var(--text)}.btn-auto svg{color:var(--gold-hi)}
.auto-hint{margin:6px 2px 14px;font-size:12px;color:var(--muted);text-align:center}
.btn-ghost:disabled{opacity:.4;cursor:not-allowed}
.w100{width:100%}.grow{flex:1}.mt8{margin-top:8px}.mt12{margin-top:12px}
.sm{font-size:13px}.muted{color:var(--muted)}.gold{color:var(--gold-hi)}.pink{color:var(--pink-hi)}
.tiny{font-size:11.5px;color:var(--faint);text-align:center;margin:8px 0 0}
.tiny.left{text-align:left}
.eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--gold-hi);text-transform:uppercase}
html[lang=th] .eyebrow,html[lang=th] .m-num,html[lang=th] .m-sub,html[lang=th] .pc-eyebrow{letter-spacing:0}
.hero{position:relative;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;border:1px solid rgba(230,151,246,.22);pointer-events:none}
.hero::before{width:190px;height:190px;right:-70px;top:-80px}
.hero::after{width:120px;height:120px;right:-30px;top:-40px;border-color:rgba(229,99,181,.25)}
.hero h1{font:500 26px/1.15 var(--display);margin:6px 0}
.hero p{margin:0;color:var(--muted);font-size:14px;max-width:260px}
.hero .from{margin-top:12px;font-size:13px;color:var(--muted)}
.hero .from b{color:var(--gold-hi);font-size:18px;margin-left:4px}
.promo-car{margin-bottom:16px}
.pc-track{position:relative;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:0 16px;scroll-padding-inline:16px;scrollbar-width:none}
.pc-track::-webkit-scrollbar{display:none}
.pc-slide{flex:0 0 100%;scroll-snap-align:start;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px 18px;min-height:138px;border-radius:18px;border:1px solid var(--line-2);cursor:pointer}
.pc-0{background:var(--pc-0)}.pc-1{background:var(--pc-1)}.pc-2{background:var(--pc-2)}.pc-3{background:var(--pc-3)}.pc-4{background:var(--pc-4)}
.pc-eyebrow{font-size:11px;letter-spacing:.06em;color:rgba(255,255,255,.85)}
.pc-h{font-size:18px;font-weight:600;line-height:1.3;text-wrap:balance}
.pc-s{font-size:13px;color:rgba(255,255,255,.8)}
.pc-cta{margin-top:auto;padding-top:6px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:#fff}
.pc-cta code{font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;padding:2px 8px;border-radius:6px;border:1px dashed var(--line-2);color:var(--text)}
.pc-dots{display:flex;justify-content:center;gap:2px;margin-top:4px}
.pc-dots button{width:24px;height:22px;border:0;padding:0;background:none;display:grid;place-items:center;cursor:pointer}
.pc-dots button::after{content:'';width:7px;height:7px;border-radius:4px;background:var(--line-2);transition:width .2s}
.pc-dots button.on::after{width:18px;background:var(--gold-hi)}
.promo-chip{display:inline-flex;align-items:center;gap:8px;margin-top:6px;padding:5px 5px 5px 12px;border-radius:999px;background:rgba(127,220,174,.1);color:var(--ok);font-size:12.5px}
.promo-chip button{width:22px;height:22px;border-radius:50%;border:0;background:rgba(127,220,174,.16);color:var(--ok);display:grid;place-items:center;cursor:pointer}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.sec-h h2{font-size:16px;margin:0;font-weight:600}
.dates{position:relative;display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x proximity;scroll-padding-inline:16px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.date{position:relative;flex:0 0 60px;height:78px;scroll-snap-align:start;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;padding:0}
.date .dow{font-size:11.5px;color:var(--muted)}
.date .d{font:500 22px/1.1 var(--display)}
.date .m{font-size:11px;color:var(--muted)}
.date.sel{background:var(--primary-grad);border-color:transparent;color:var(--on-primary)}
.date.sel .dow,.date.sel .m{color:rgba(255,255,255,.82)}
.date .sp,.spd{width:6px;height:6px;border-radius:50%;background:var(--z-mezz);display:inline-block}
.date .sp{position:absolute;top:7px;right:7px}
.legend-note{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);margin-top:6px}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.time{position:relative;display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:14px;min-height:100px;border-radius:16px;background:var(--surface);border:1px solid var(--line);cursor:pointer}
.time .t{font:500 26px/1.2 var(--display)}
.time .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.time .s.warn{color:var(--warn)}.time .s.bad{color:var(--danger)}
.meter{display:block;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:auto}
.meter i{display:block;height:100%;border-radius:2px}
.time.sel{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);background:var(--surface-2)}
.time.off{opacity:.6}
.time.off .t{color:var(--faint)}
.badge{position:absolute;top:10px;right:10px;font-size:10.5px;padding:2px 8px;border-radius:999px;background:rgba(229,99,181,.2);color:var(--pink-hi)}
.zones{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
.zone-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.zone-row:last-child{border-bottom:0}
.zone-row b{margin-left:auto;font-weight:600}
.sw{width:12px;height:12px;border-radius:4px;flex:0 0 auto;display:inline-block}
.sw.z-diamond{background:var(--z-diamond)}.sw.z-gold{background:var(--z-gold)}.sw.z-silver{background:var(--z-silver)}.sw.z-mezz{background:var(--z-mezz)}
.show-sum{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);margin-bottom:14px}
.show-sum .display{font:500 15px var(--display)}
.link{background:none;border:0;color:var(--gold-hi);font-size:13px;cursor:pointer;margin-left:auto;text-decoration:underline;text-underline-offset:3px;padding:4px 0;white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;border:1px solid var(--line-2);background:transparent;font-size:13px;cursor:pointer;text-align:left}
.chip.on{background:var(--surface-2);border-color:var(--gold)}
.map-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:5px}
.lg i{width:14px;height:12px;border-radius:3px;display:inline-block}
.lg .a{background:linear-gradient(90deg,var(--z-diamond) 25%,var(--z-gold) 25% 50%,var(--z-silver) 50% 75%,var(--z-mezz) 75%)}
.lg .tk{background:var(--taken)}
.lg .me{background:#fff;box-shadow:inset 0 0 0 2px var(--gold)}
.zoom{display:flex;gap:6px}
.zoom button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.zoom button:disabled{opacity:.35;cursor:not-allowed}
.map-wrap{overflow-x:auto;overflow-y:hidden;border-radius:16px;background:#141418;border:1px solid var(--line);-webkit-overflow-scrolling:touch}
.map-wrap svg{display:block}
.seat{cursor:pointer;transition:opacity .15s}
.seat.z-diamond{fill:var(--z-diamond)}.seat.z-gold{fill:var(--z-gold)}.seat.z-silver{fill:var(--z-silver)}.seat.z-mezz{fill:var(--z-mezz)}
.seat.tk{fill:var(--taken);cursor:not-allowed}
.seat.me{fill:#fff;stroke:var(--gold);stroke-width:2.5}
.seat.dim{opacity:.2}
.ck{fill:none;stroke:#1b1b1c;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.rowlbl{fill:var(--faint);font:600 10px var(--body)}
.stage-shape{fill:#30303b;stroke:var(--gold);stroke-width:1}
.stage-t{fill:var(--gold-hi);font:500 15px var(--display)}
.mz-t{fill:var(--muted);font:600 11px var(--body)}
html[lang=en] .stage-t{letter-spacing:.3em}
.mz-t tspan.en{letter-spacing:.2em}
.mz-line{stroke:var(--line-2);stroke-dasharray:4 4}
.hint{margin:8px 0 12px}
.picked{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pk{display:flex;align-items:center;gap:6px;padding:5px 5px 5px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.pk button{width:24px;height:24px;border-radius:50%;border:0;background:var(--surface-2);cursor:pointer;display:grid;place-items:center}
.ttl{font-size:20px;margin:0 0 4px;font-weight:600}
.fs{font-size:13px;color:var(--muted);margin:0 0 14px}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:rgba(255,197,110,.1);color:var(--warn);font-size:13px;margin-bottom:12px}
.note svg{flex:0 0 auto;margin-top:2px}
.item{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.item .ic{width:46px;height:46px;flex:0 0 auto;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;color:var(--gold-hi)}
.item .tx{flex:1;min-width:0}
.item .nm{font-weight:600;font-size:14.5px}
.item .ds{font-size:12.5px;color:var(--muted)}
.item .pr{font-size:13px;color:var(--gold-hi);margin-top:2px}
.item.off{opacity:.45}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:32px;height:32px;border-radius:50%;border:1px solid var(--line-2);background:transparent;cursor:pointer;display:grid;place-items:center}
.stepper button:disabled{opacity:.3;cursor:not-allowed}
.stepper span{min-width:18px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.sum summary{list-style:none;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:600}
.sum summary::-webkit-details-marker{display:none}
.sum summary .chev{display:inline-block;transition:transform .2s;margin-left:6px}
.sum[open] summary .chev{transform:rotate(180deg)}
.sum-body{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.sum-line{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;color:var(--muted)}
.sum-line b{color:var(--text);font-weight:500;text-align:right}
.sum-line.disc,.sum-line.disc b{color:var(--ok)}
.sum-total{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:600}
.fh{font-size:16px;font-weight:600;margin:22px 0 4px}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.hint-s{font-size:12px;color:var(--faint);margin-top:5px}
.in{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;color:var(--text);font:16px var(--body);outline:none}
.in:focus{border-color:var(--gold)}
.in.bad{border-color:var(--danger)}
textarea.in{resize:vertical;min-height:96px;line-height:1.5}
.err{color:var(--danger);font-size:12px;margin-top:5px}
.phone-row{display:grid;grid-template-columns:96px 1fr;gap:8px}
.promo{display:flex;gap:8px;margin-top:8px}
.promo .in{flex:1;min-width:0;text-transform:uppercase}
.promo .btn{padding:12px 16px}
.promo-ok,.promo-wait{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:12px;font-size:13.5px;margin-top:8px}
.promo-ok{background:rgba(127,220,174,.1);color:var(--ok)}
.promo-wait{background:rgba(255,197,110,.1);color:var(--warn)}
.promo-ok .link{color:var(--ok)}.promo-wait .link{color:var(--warn)}
.promo-ok svg,.promo-wait svg{flex:0 0 auto}
.pm{width:100%;display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:8px;cursor:pointer;text-align:left}
.pm.on{border-color:var(--gold);background:var(--surface-2)}
.pm .rd{width:20px;height:20px;border-radius:50%;border:2px solid var(--line-2);flex:0 0 auto;display:grid;place-items:center}
.pm.on .rd{border-color:var(--gold)}
.pm.on .rd::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--gold-hi)}
.pm .tx{flex:1;display:flex;flex-direction:column}
.pm .nm{font-weight:600;font-size:14.5px}
.pm .ds{font-size:12px;color:var(--muted)}
.pm-ic{color:var(--muted)}
.agree{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:16px;cursor:pointer}
.agree input{width:20px;height:20px;accent-color:var(--gold);margin:1px 0 0;flex:0 0 auto}
.layer{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.62);display:flex;align-items:flex-end}
.sheet{width:100%;max-height:88%;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:up .22s ease-out}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:0 auto 14px}
.sheet h3{font-size:18px;margin:0 0 6px}
.sheet>p{margin:0 0 16px;color:var(--muted);font-size:14px}
.sheet .btn+.btn{margin-top:10px}
.sheet .mission-card{margin-bottom:14px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
.or-sep{display:flex;align-items:center;gap:10px;margin:4px 0 14px;color:var(--faint);font-size:12px}.or-sep::before,.or-sep::after{content:'';flex:1;height:1px;background:var(--line-2)}
.sm-list{display:grid;gap:10px;margin-top:10px}.sm-row span{display:block;font-size:12px;color:var(--muted)}.sm-row b{display:block;font-weight:500;font-size:14.5px}

.dash-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dash-h h2{font:500 24px var(--display);margin:0;color:var(--text)}
.dash-act{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.dash-act .btn{padding:10px 16px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
.dcard h3{margin:0 0 10px;font-size:15px;font-weight:600}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{min-width:170px}.tbl td:last-child{min-width:220px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) 110px 40px;gap:10px;align-items:center;font-size:13.5px;padding:5px 0}
.bar-row .trk{height:8px;border-radius:4px;background:rgba(255,255,255,.08)}
.bar-row .trk i{display:block;height:100%;border-radius:4px;background:var(--gold)}
.bar-row .trk.ev i{background:var(--z-mezz)}
.bar-row b{text-align:right;font-variant-numeric:tabular-nums}
.run{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:6px;font-size:13.5px;min-width:0}
.run:first-of-type{border-top:0}
.run-h{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.run-h b{font-size:14.5px}
.pill{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:rgba(127,220,174,.12);color:var(--ok)}
.pill.no{background:rgba(255,145,145,.12);color:var(--danger)}
.run p{margin:0;color:var(--muted);overflow-wrap:anywhere}
.run p.cm{color:var(--text)}
.csv-out{width:100%;min-height:140px;font:12px ui-monospace,Menlo,monospace}
@media (max-width:900px){.proto{display:none}.demo-chip{display:inline-flex}}
@media (max-width:600px){.stage{padding:0;display:block;height:100%}.phone{width:100%;height:100%;max-height:none;border:0;border-radius:0;box-shadow:none}}
</style>
</head>

function bestSeats(zone,n){

  SEATS.filter(s=>s.zone===zone).forEach(s=>{(groups[s.row+s.block]??=[]).push(s)});
  let best=null,bs=Infinity;
  for(const g of Object.values(groups)){
    g.sort((a,b)=>a.n-b.n);
    for(let i=0;i+n<=g.length;i++){
      const w=g.slice(i,i+n);if(w.some(s=>tk.has(s.id)))continue;

  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(!inF(x,y)&&r()<.48)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const fp=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return`<svg width="${size}" height="${size}" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true"><g fill="#1b1b1c">${s}${fp(0,0)}${fp(n-7,0)}${fp(0,n-7)}</g></svg>`;
}

function playedSet(){try{return new Set(JSON.parse(localStorage.getItem('tf_played')||'[]'))}catch(e){return new Set()}}
function markPlayed(id){try{const p=playedSet();p.add(id);if(p.size>=Object.keys(MISSIONS).length)p.clear();localStorage.setItem('tf_played',JSON.stringify([...p]))}catch(e){}}
// Draws a mission this browser has not played yet, never the one already shown.
function pickTarget(){
  const ids=Object.keys(MISSIONS),played=playedSet();
  let pool=ids.filter(id=>!played.has(id)&&id!==S.pick);
  if(!pool.length)pool=ids.filter(id=>id!==S.pick);
  const a=new Uint32Array(1);crypto.getRandomValues(a);return pool[a[0]%pool.length];
}

  if(S.mode==='intro')h=`<button class="btn btn-gold w100" data-act="toChoose">${t('g_next')}</button>`;
  else if(S.mode==='choose')h=`<button class="btn btn-ghost w100" data-act="toIntro">${t('back')}</button>`;
  else if(S.mode==='deck')h=`<button class="btn btn-ghost w100" data-act="toChoose">${t('back')}</button>`;
  else if(S.mode==='reveal')h=S.revealed?`<button class="btn btn-gold w100" data-act="toBrief">${t('g_next')}</button>`:'';
  else if(S.mode==='brief')h=`<button class="btn btn-gold w100" data-act="gStart">${t('g_next')}</button>`;
  else if(S.mode==='survey')h=`<button class="btn btn-gold w100" data-act="sSubmit">${t('s_submit')}</button>`;
  else if(S.mode==='result')h='';
  else if(S.step===1){
    const sh=S.time&&showsFor(S.dateIdx).find(x=>x.time===S.time);
    h=`<div class="bar-info"><div class="k">${S.time?fmtDate(DATES[S.dateIdx]):t('bar_nosel')}</div><div class="v">${S.time?`${S.time}${sh&&sh.special?` · <span class="pink">${t('special')}</span>`:''}`:'—'}</div></div><button class="btn btn-gold" data-act="toSeats"${S.time?'':' disabled'}>${t('btn_seats')}</button>`;
  }else if(S.step===2){
    const ids=[...S.seats].sort(seatSort);
    h=`<div class="bar-info"><div class="k">${ids.length?`${t(ids.length===1?'seat_1':'seats_n',{n:ids.length})} · ${ids.join(', ')}`:t('bar_seats_none')}</div><div class="v">฿${fmt(tt.tickets)}</div></div><button class="btn btn-gold" data-act="toFood"${ids.length?'':' disabled'}>${t('btn_next')}</button>`;
  }else if(S.step===3&&S.sub==='food'){
    const any=FOOD.some(f=>S.food[f.id]);

async function submitClaude(r){
  const[db,u]=await Promise.all([cap('db'),cap('user')]);
  const id=u?await u.id():null;if(!db||!id)throw{code:'none'};
  if(u&&(await u.can('data.write'))===false)throw{code:'readonly'};

  }

    }else if(st==='closed'){
      ev('closed');
      openSheet(`<div class="sh-ic">${IC.clock}</div><h3>${t('closed_title')}</h3><p>${t('closed_body')}</p><button class="btn btn-gold w100" data-act="proto">${t('chat')}</button><button class="btn btn-ghost w100" data-act="close">${t('close')}</button>`);
    }else{S.time=tm;render(true)}
  },
  pickSug(el){S.dateIdx=+el.dataset.i;S.time=el.dataset.time;closeSheet();render(true);scrollDateIntoView()},
  toSeats(){if(!S.time)return;S.step=2;S.seats=[];S.zone=S.zonePref||null;startHold();render();if(S.zone)scrollMapToZone(S.zone)},
  zone(el){const z=el.dataset.z;S.zone=S.zone===z?null:z;render(true);scrollMapToZone(S.zone)},
  zoom(el){
    const w=$('#mapwrap'),ratio=(w.scrollLeft+w.clientWidth/2)/w.scrollWidth;
    S.zoomIdx=Math.max(0,Math.min(ZOOMS.length-1,S.zoomIdx+ +el.dataset.d));render(true);
    const w2=$('#mapwrap');w2.scrollLeft=ratio*w2.scrollWidth-w2.clientWidth/2;
  },
  seat(el){
    const id=el.dataset.id,i=S.seats.indexOf(id);
    if(i>=0)S.seats.splice(i,1);
    else if(taken(curKey()).has(id)){ev('taken');toast(t('seat_taken'));return}
    else if(S.seats.length>=10){toast(t('max_seats'));return}
    else S.seats.push(id);
    render(true);
  },
  unseat(el){S.seats=S.seats.filter(x=>x!==el.dataset.id);render(true)},
  autopick(){S.ap.zone=S.zone||S.ap.zone;apSheet()},
  apn(el){S.ap.n=Math.max(1,Math.min(10,S.ap.n+ +el.dataset.d));apSheet()},
  apz(el){S.ap.zone=el.dataset.z;apSheet()},
  apgo(){const ids=bestSeats(S.ap.zone,S.ap.n);if(!ids){toast(t('ap_none'));return}ev('autopick');S.seats=ids;closeSheet();render(true);toast(t('ap_done',{s:ids.join(', ')}))},
  toFood(){if(!S.seats.length)return;S.step=3;S.sub='food';if(DATES[S.dateIdx].getDay()===2)FOOD.filter(f=>f.restaurant).forEach(f=>delete S.food[f.id]);render()},
  qty(el){const id=el.dataset.id;S.food[id]=Math.max(0,Math.min(20,(S.food[id]||0)+ +el.dataset.d));if(!S.food[id])delete S.food[id];render(true)},
  toPay(){S.sub='pay';render()},
  promo(){
    const c=S.promoInput.trim().toUpperCase();if(!c)return;
    if(!PROMOS.some(p=>p.code===c)){S.promoErr=true;ev('promoFail');render(true);return}
    S.promo=c;S.promoErr=false;S.promoInput='';if(!evalPromo(c).ok)ev('promoFail');render(true);
  },
  promoList(){promoSheet()},
  promoUse(el){S.promoInput=el.dataset.c;closeSheet();ACT.promo()},
  promoRm(){S.promo=null;S.promoInput='';S.zonePref=null;render(true)},
  promoSlide(el){
    const p=PROMOS[+el.dataset.i];ev('promoTap');S.promo=p.code;S.promoErr=false;S.zonePref=p.code==='MEZZ990'?'mezz':null;S.pcIdx=+el.dataset.i;pcPause=Date.now()+8000;
    if(p.code==='EARLY15'&&S.dateIdx<7){S.dateIdx=7;if(S.time&&!bookable(7,S.time))S.time=null}
    if(p.code==='SAT1630'){S.dateIdx=SAT_IDX;S.time=bookable(SAT_IDX,'16:30')?'16:30':null}
    render(true);scrollDateIntoView();toast(t('promo_picked',{c:p.code}));
  },
  pcDot(el){S.pcIdx=+el.dataset.i;pcPause=Date.now()+8000;pcGo(true)},
  pm(el){S.pay=el.dataset.m;render(true)},
  pay(){
    S.errors=validate();
    if(Object.keys(S.errors).length){ev('formErr');render(true);$('.in.bad, #err-agree')?.scrollIntoView({block:'center',behavior:'smooth'});toast(t('fix_form'));return}
    gwSheet();
  },
  payok(){book()},
  payfail(){ev('payFail');openSheet(`<div class="sh-ic">${IC.alert}</div><h3>${t('fail_title')}</h3><p>${t('fail_body',{t:mmss(remaining())})}</p><button class="btn btn-gold w100" data-act="retry">${t('retry')}</button><button class="btn btn-ghost w100" data-act="changePm">${t('change_pm')}</button>`)},
  retry(){gwSheet()},
  changePm(){closeSheet();$('#pm-h')?.scrollIntoView({block:'start',behavior:'smooth'})},
  reselect(){closeSheet();startHold();render()},
  proto(){toast(t('proto_toast'))},
  again(){const m=S.mode;resetBooking();S.mode=m;render()},
  demo(){openSheet(`<h3>${t('demo_title')}</h3>${protoControls()}<div style="height:16px"></div><button class="btn btn-ghost w100" data-act="close">${t('close')}</button>`)},
  jump(el){demoJump(el.dataset.s)},
  expireNow(){if(!S.holdEnd){toast(t('d_need_hold'));return}closeSheet();S.holdEnd=Date.now();tick()},
  reset(){const keep={lang:S.lang,isOwner:S.isOwner,dashRuns:S.dashRuns,dashState:S.dashState,nick:S.nick,dept:S.dept};Object.assign(S,JSON.parse(INIT_S),keep);closeSheet();render()},
  close(){closeSheet()},
  toIntro(){S.mode='intro';render()},
  toChoose(){if(S.mode==='intro'&&needWho())return;S.mode='choose';render()},
  toDeck(){Object.keys(MISSIONS).forEach(id=>{new Image().src=charImg(id)});S.pick=null;S.mode='deck';render()},
  gCard(el){
    if(S.spinning)return;S.spinning=true;
    const target=pickTarget(),rm=reduceMotion();
    document.querySelectorAll('.deck .cd').forEach(c=>c.classList.add(c===el?'pick':'off'));
    setTimeout(()=>{
      S.spinning=false;S.pick=target;S.pickVia='card';S.revealed=rm;resetBooking();S.g=newGame();S.g.mission=target;S.g.via='card';S.mode='reveal';render();
      if(!rm)setTimeout(()=>{S.revealed=true;$('#flip')?.classList.add('on');setTimeout(renderBar,900)},300);
    },rm?0:450);
  },
  toBrief(){S.mode='brief';render()},
  gFreeRun(){
    if(needWho())return;
    resetBooking();S.g=newGame();S.g.mission=FREE;S.g.via='free';ACT.gStart();
  },
  gFree(){resetBooking();S.g=newGame();S.mode='free';render()},
  gStart(){S.mode='run';S.g.start=Date.now();render();openCoupons()},
  cpGet(el){const c=el.dataset.c;if(!S.g.wallet.includes(c))S.g.wallet.push(c);$('.cpn-pop').innerHTML=couponBody();$(`.cpn[data-c="${c}"]`)?.classList.add('just')},
  cpStart(){closeSheet();S.g.start=Date.now();S.g.curAt=S.g.start;render()},
  brief(){ev('brief');openSheet(`${missionCard()}<button class="btn btn-gold w100" data-act="close">${t('close')}</button><button class="btn btn-ghost w100" data-act="giveup">${t('g_giveup')}</button>`)},
  giveup(){closeSheet();S.g.gaveUp=true;S.g.end=Date.now();S.holdEnd=null;S.mode='survey';render()},
  toSurvey(){S.mode='survey';render()},
  rate(el){S.g.ratings[+el.dataset.q]=+el.dataset.v;render(true)},
  sSubmit(){
    const miss=S.g.ratings.filter(v=>!v).length;
    if(miss){S.g.sErr=true;render(true);$('.q.bad')?.scrollIntoView({block:'center',behavior:'smooth'});toast(t('s_missing',{n:miss}));return}
    S.g.run=buildRun();if(!isFree(S.g.mission))markPlayed(S.g.mission);S.mode='result';render();submitRun();watchRuns();
  },
  rSave(){saveRunImage(S.g.run)},
  rCopy(){copyText(runText(S.g.run),()=>toast(t('r_copied')),()=>{const d=$('#rtd');if(d)d.open=true;const ta=$('#rtext');if(ta){ta.focus();ta.select()}toast(t('r_copy_fail'))})},
  rAgain(){const done=S.mode==='result';resetBooking();S.g=newGame();if(done){S.pick=null;S.pickVia=null}S.mode='intro';render()},
  dash(){closeSheet();$('#dash').hidden=false;renderDash()},
  dashClose(){$('#dash').hidden=true},
  stats(){openStats()},
  statsClose(){$('#stats').hidden=true},
  lbTab(el){ST.tab=el.dataset.v;renderStats()},
  lbCsv(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([fbCsv(ST.runs||[])],{type:'text/csv'}));a.download=`tiffany-results-${ymd(new Date())}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)},
  dashCsv(){
    const runs=(S.dashRuns||[]).filter(r=>r&&MISSIONS[r.mission]).slice().sort((a,b)=>String(b.at).localeCompare(String(a.at))),csv=toCsv(runs);
    copyText(csv,()=>toast(t('d_copied')),()=>{const box=$('#csvbox');if(box){box.innerHTML=`<div class="dcard"><p class="muted" style="margin:0 0 8px">${t('d_csv_fail')}</p><textarea class="in csv-out" id="csv-out" readonly>${esc(csv)}</textarea></div>`;const ta=$('#csv-out');ta.focus();ta.select()}})
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&ACT[el.dataset.act])ACT[el.dataset.act](el,e)});
$('#layer').addEventListener('click',e=>{if(e.target.id==='layer'&&!S.sheetLocked)closeSheet()});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(!$('#layer').hidden&&!S.sheetLocked)closeSheet();else if(!$('#stats').hidden)$('#stats').hidden=true;else if(!$('#dash').hidden)$('#dash').hidden=true});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='g-nick'){S.nick=e.target.value;if(S.nickErr){S.nickErr=false;e.target.classList.remove('bad');$('#err-nick')?.remove()}return}
  if(id==='s-comment'){S.g.comment=e.target.value;return}
  const f=e.target.dataset.f;if(!f)return;
  if(f==='promo'){S.promoInput=e.target.value;if(S.promoErr){S.promoErr=false;e.target.classList.remove('bad');$('#err-promo')?.remove()}return}
  S.form[f]=e.target.value;
  if(S.errors[f]){delete S.errors[f];e.target.classList.remove('bad');$('#err-'+f)?.remove()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='g-dept'){S.dept=e.target.value;if(S.deptErr){S.deptErr=false;e.target.classList.remove('bad');$('#err-dept')?.remove()}return}
  if(e.target.id==='agree'){S.agree=e.target.checked;if(S.errors.agree){delete S.errors.agree;$('#err-agree')?.remove()}}
  else if(e.target.dataset.f&&e.target.dataset.f!=='promo'){S.form[e.target.dataset.f]=e.target.value;if(e.target.dataset.f==='cc'){delete S.errors.phone;render(true)}}
});
document.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('sum'))S.sumOpen=e.target.open},true);

render();
(async()=>{
  const u=await cap('user');
  if(!u||!(await u.isOwner()))return;
  S.isOwner=true;render(true);
  const db=await cap('db');
  if(!db){S.dashState='err';renderDash();return}
  db.collection('results').onSnapshot(snap=>{
    S.dashRuns=snap.docs.flatMap(d=>{const x=d.data();return Array.isArray(x&&x.runs)?x.runs:[]});S.dashState='ok';
    if(S.mode==='intro')render(true);else renderProto();renderDash();
  },()=>{S.dashState='err';renderDash()});
})();
</script>
</body>
</html>
